# SPDX-License-Identifier: Apache-2.0
# SPDX REUSE Specification 3.3 metadata for SUSI Core (zero runtime Rust LOC impact).
version = 1

[[annotations]]
path = [
    "src/**",
    "crates/**",
    "tests/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 IntelliBitz"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    ".githooks/**",
    ".cargo/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 IntelliBitz"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "docs/**",
    "*.md",
    "Cargo.toml",
    "Cargo.lock",
    "clippy.toml",
    "deny.toml",
    "rust-toolchain.toml",
    ".gitattributes",
    ".gitignore",
    ".susi-repo-role",
    "LICENSE",
    "NOTICE",
    "REUSE.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 IntelliBitz"
SPDX-License-Identifier = "Apache-2.0"
