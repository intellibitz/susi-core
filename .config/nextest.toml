# cargo-nextest runs every test in its own process, all test programs side by
# side: the whole suite in a fraction of `cargo test`'s time, which runs the
# programs one after another (the 10-second line, AGENTS.md "Speed").
#
# Eight test threads is the default, a safe count for a small machine. The
# Linux gates run from Windows raise it to one per logical core through
# NEXTEST_TEST_THREADS.
#
# Until 2026-11-22 an override here gave two slots each to the tests that
# spawned `susi` sessions (gmcp_requirements, audit_query_surface,
# audit_chain_verifies). Those test programs left core with the code they
# covered, and nextest refuses an override that names no program, so the
# override went with them. A test that again needs a reserved share of the CPU
# gets an override naming it, with the reason.
[profile.default]
test-threads = 8
