# cargo-deny config. NOTE: the default config filename cargo-deny looks
# for is `deny.toml` at the repo root, not `cargo-deny.toml` - a file
# named `cargo-deny.toml` here is silently ignored and every check falls
# back to defaults (which reject nearly every license in the tree).

[graph]
# Restrict the dependency graph to the targets these libraries are built for:
# Core is built and tested on x86_64 Linux, and Susi builds the libraries for
# x86_64 Linux and x86_64 Windows. Core builds no program of its own.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
[advisories]
# No exceptions. RUSTSEC-2024-0436 (paste) was one until paste left the graph.
ignore = []

[licenses]
# Strict product policy: no exceptions are silently grandfathered in.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
]
# The one exception, decided on 2026-11-22: unicode-ident is licensed
# "(MIT OR Apache-2.0) AND Unicode-3.0" for its Unicode tables. Only the procedural
# macros use it while compiling (every path to it runs through serde_derive), so its
# tables are not linked into anything built from these libraries. It holds for this
# crate alone.
exceptions = [
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
