[workspace]
members = [
    ".",
    "crates/susi-paths",
    "crates/susi-error",
    "crates/susi-vendor-getrandom",
    "crates/susi-vendor-serde",
    "crates/susi-vendor-serde-json",
    "crates/susi-vendor-sha2"]
# Historical `vendor/` tree is gone (model/TLS patches moved with their plugs).
# Keep the exclude so a stray directory never becomes a workspace member.
exclude = ["vendor"]

[package]
name = "susi"
version = "0.21.72"
edition = "2021"
description = "Susi Core: the small libraries Susi, the product, builds on (home and path resolution, the typed error, and the wrappers of serde, serde_json, sha2 and getrandom)."
license = "Apache-2.0"
repository = "https://github.com/intellibitz/susi-core"
homepage = "https://github.com/intellibitz/susi-core"
publish = false
# Last toolchain this was actually built and tested against; CI tracks
# `stable` rather than pinning to this, so treat it as a floor, not a
# guarantee earlier versions work.
rust-version = "1.98"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
# Root package mirrors the workspace deny set (it keeps its own
# `missing_docs` rust lint, which is intentionally not workspace-wide).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
too_many_arguments = "warn"
complexity = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# An ignored test gives its reason; an expected panic names its message.
ignore_without_reason = "deny"
should_panic_without_expect = "deny"
# No debugging leftovers.
dbg_macro = "deny"
# Hard-denied: production code returns typed `EaiResult`s; panic-capable
# macros require an inline `#[allow]` + justification comment (the audit
# trail), same pattern as `#[allow(unsafe_code)]` on justified FFI sites.
# Test code is exempt via `#![cfg_attr(test, allow(...))]` crate shims.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
too_many_arguments = "warn"
complexity = { level = "warn", priority = -1 }

[workspace.dependencies]
susi-paths = { path = "crates/susi-paths" }
susi-error = { path = "crates/susi-error" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
getrandom = "0.2"

# The repository's own tests read JSON records and hash files through the same wrappers.
[dev-dependencies]
serde = { package = "susi-vendor-serde", path = "crates/susi-vendor-serde" }
serde_json = { package = "susi-vendor-serde-json", path = "crates/susi-vendor-serde-json" }
sha2 = { package = "susi-vendor-sha2", path = "crates/susi-vendor-sha2" }
# Test homes are isolated through the path library's test helpers.
susi-paths = { workspace = true }


# dev and test must keep identical settings: any difference (codegen-units
# included) gives every dependency a second fingerprint, so a `cargo build`
# followed by a `cargo test` compiles the whole graph twice. 16 units also
# measured faster than 256 for the cold `cargo build -p susi` on Linux
# (T-BUILDTIME-1, docs/lean-core.md wave log).
[profile.dev]
opt-level = 0
debug = 0
codegen-units = 16
incremental = true
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0
debug = 0
codegen-units = 16
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

