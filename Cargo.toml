[workspace]
members = [
    ".",
    "crates/susi-paths",
    "crates/susi-error",
    "crates/susi-vendor-getrandom",
    "crates/susi-vendor-serde",
    "crates/susi-vendor-serde-json",
    "crates/susi-vendor-sha2"]

[package]
name = "susi"
version = "0.21.72"
edition = "2021"
description = "Susi Core: the small libraries Susi, the product, builds on (the platform-service table, a windowless command launcher, the metrics sink, and the wrappers of serde, serde_json, sha2 and getrandom)."
license = "Apache-2.0"
repository = "https://github.com/intellibitz/susi-core"
homepage = "https://github.com/intellibitz/susi-core"
publish = false
# The minimum compiler this manifest declares; the libraries are built and
# tested only with the one pinned in rust-toolchain.toml.
rust-version = "1.98"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
# Root package mirrors the workspace deny set (it keeps its own
# `missing_docs` rust lint, which is intentionally not workspace-wide).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
too_many_arguments = "warn"
complexity = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# An ignored test gives its reason; an expected panic names its message.
ignore_without_reason = "deny"
should_panic_without_expect = "deny"
# No debugging leftovers.
dbg_macro = "deny"
# Hard-denied: production code returns a typed `Result`; panic-capable
# macros require an inline `#[allow]` + justification comment (the audit
# trail). Test code is exempt via `#![cfg_attr(test, allow(...))]` crate shims.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
too_many_arguments = "warn"
complexity = { level = "warn", priority = -1 }

[workspace.dependencies]
susi-paths = { path = "crates/susi-paths" }
susi-error = { path = "crates/susi-error" }

# The repository's own tests read JSON records through the same wrappers.
[dev-dependencies]
serde = { package = "susi-vendor-serde", path = "crates/susi-vendor-serde" }
serde_json = { package = "susi-vendor-serde-json", path = "crates/susi-vendor-serde-json" }


# dev and test must keep identical settings: any difference (codegen-units
# included) gives every dependency a second fingerprint, so a `cargo build`
# followed by a `cargo test` compiles the whole graph twice.
[profile.dev]
opt-level = 0
debug = 0
codegen-units = 16
incremental = true
split-debuginfo = "unpacked"

[profile.test]
opt-level = 0
debug = 0
codegen-units = 16
incremental = true
split-debuginfo = "unpacked"

